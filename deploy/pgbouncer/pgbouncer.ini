[databases]
karm = host=db port=5432 dbname=karm user=karm password=${POSTGRES_PASSWORD}

[pgbouncer]
pool_mode = transaction
max_client_conn = 200
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 50
max_user_connections = 50

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

stats_period = 60
admin_users = karm
stats_users = karm

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

ignore_startup_parameters = extra_float_digits
application_name_add_host = 1

listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp