# KARM OS - Falco Custom Rules
# Detects suspicious activity in KARM containers

# ------------------------------------------------------------------------
# KARM Gateway Rules
# ------------------------------------------------------------------------

- rule: KARM Gateway Unexpected Process
  desc: Detect unexpected processes in KARM gateway container
  condition: >
    container.image.repository=karm-os and
    proc.name not in (node, npm, sh, bash, pg_dump, pg_restore, aws, gsutil, az, rclone)
  output: >
    Unexpected process in KARM gateway (user=%user.name cmdline=%proc.cmdline container=%container.name)
  priority: WARNING
  tags: [karm, process]

- rule: KARM Gateway Network Connection
  desc: Detect unexpected outbound connections from gateway
  condition: >
    container.image.repository=karm-os and
    evt.type in (connect, accept) and
    fd.sock.family = ipv4 and
    fd.sport != 8787 and
    fd.sport != 8788 and
    fd.sport != 3000 and
    fd.sport != 5432 and
    fd.sport != 6432
  output: >
    Unexpected network connection from KARM gateway (cmdline=%proc.cmdline fd.sport=%fd.sport fd.dport=%fd.dport container=%container.name)
  priority: WARNING
  tags: [karm, network]

- rule: KARM Gateway File Write Outside Data Dir
  desc: Detect writes outside allowed directories
  condition: >
    container.image.repository=karm-os and
    evt.type in (open, openat, creat) and
    evt.arg.flags contains O_WRONLY or evt.arg.flags contains O_RDWR and
    fd.name not startswith /data and
    fd.name not startswith /tmp and
    fd.name not startswith /app and
    fd.name not startswith /var/log and
    fd.name not startswith /proc and
    fd.name not startswith /dev
  output: >
    File write outside allowed dirs in KARM gateway (file=%fd.name cmdline=%proc.cmdline container=%container.name)
  priority: WARNING
  tags: [karm, filesystem]

# ------------------------------------------------------------------------
# PostgreSQL Rules
# ------------------------------------------------------------------------

- rule: PostgreSQL Unexpected Process
  desc: Detect unexpected processes in PostgreSQL container
  condition: >
    container.image.repository=postgres and
    proc.name not in (postgres, pg_dump, pg_restore, pg_isready, sh, bash, psql)
  output: >
    Unexpected process in PostgreSQL (user=%user.name cmdline=%proc.cmdline container=%container.name)
  priority: WARNING
  tags: [karm, database, process]

- rule: PostgreSQL Config Change
  desc: Detect PostgreSQL configuration file modifications
  condition: >
    container.image.repository=postgres and
    evt.type in (open, openat, creat) and
    evt.arg.flags contains O_WRONLY and
    fd.name contains postgresql.conf
  output: >
    PostgreSQL config modified (file=%fd.name cmdline=%proc.cmdline container=%container.name)
  priority: CRITICAL
  tags: [karm, database, config]

# ------------------------------------------------------------------------
# Caddy Rules
# ------------------------------------------------------------------------

- rule: Caddy Unexpected Process
  desc: Detect unexpected processes in Caddy container
  condition: >
    container.image.repository=caddy and
    proc.name not in (caddy, sh, bash)
  output: >
    Unexpected process in Caddy (user=%user.name cmdline=%proc.cmdline container=%container.name)
  priority: WARNING
  tags: [karm, proxy, process]

- rule: Caddy Certificate File Access
  desc: Monitor access to TLS certificate files
  condition: >
    container.image.repository=caddy and
    evt.type in (open, openat) and
    fd.name contains .crt or fd.name contains .key or fd.name contains .pem
  output: >
    Caddy certificate access (file=%fd.name cmdline=%proc.cmdline container=%container.name)
  priority: INFO
  tags: [karm, proxy, tls]

# ------------------------------------------------------------------------
# General Container Rules
# ------------------------------------------------------------------------

- rule: Container Shell Spawn
  desc: Detect interactive shell spawn in containers
  condition: >
    evt.type = execve and
    proc.name in (sh, bash, zsh) and
    proc.args contains -i or proc.args contains -c
  output: >
    Interactive shell in container (user=%user.name cmdline=%proc.cmdline container=%container.name image=%container.image.repository)
  priority: WARNING
  tags: [container, shell]

- rule: Container Privilege Escalation
  desc: Detect privilege escalation attempts
  condition: >
    evt.type in (setuid, setgid, setreuid, setregid, setresuid, setresgid) and
    evt.arg.uid != evt.arg.euid
  output: >
    Privilege escalation attempt (user=%user.name uid=%evt.arg.uid euid=%evt.arg.euid cmdline=%proc.cmdline container=%container.name)
  priority: CRITICAL
  tags: [container, privilege]

- rule: Container Capability Usage
  desc: Detect use of dangerous capabilities
  condition: >
    evt.type = cap_capable and
    evt.arg.cap in (CAP_SYS_ADMIN, CAP_SYS_MODULE, CAP_SYS_RAWIO, CAP_DAC_OVERRIDE, CAP_DAC_READ_SEARCH)
  output: >
    Dangerous capability used (cap=%evt.arg.cap cmdline=%proc.cmdline container=%container.name)
  priority: WARNING
  tags: [container, capability]

# ------------------------------------------------------------------------
# KARM-Specific Business Logic Rules
# ------------------------------------------------------------------------

- rule: KARM Audit Log Tampering
  desc: Detect attempts to modify audit log files
  condition: >
    container.image.repository=karm-os and
    evt.type in (open, openat, unlink, rename) and
    fd.name contains audit and
    (evt.arg.flags contains O_WRONLY or evt.type = unlink or evt.type = rename)
  output: >
    Audit log tampering attempt (file=%fd.name operation=%evt.type cmdline=%proc.cmdline container=%container.name)
  priority: CRITICAL
  tags: [karm, audit, security]

- rule: KARM Secrets File Access
  desc: Detect access to secrets files
  condition: >
    container.image.repository=karm-os and
    evt.type in (open, openat) and
    fd.name contains .env or fd.name contains secret or fd.name contains key
  output: >
    Secrets file access (file=%fd.name cmdline=%proc.cmdline container=%container.name)
  priority: WARNING
  tags: [karm, secrets, security]

- rule: KARM Backup Directory Access
  desc: Monitor access to backup directory
  condition: >
    container.image.repository=karm-os and
    evt.type in (open, openat, unlink, rename) and
    fd.name contains /backups/
  output: >
    Backup directory access (file=%fd.name operation=%evt.type cmdline=%proc.cmdline container=%container.name)
  priority: INFO
  tags: [karm, backup]