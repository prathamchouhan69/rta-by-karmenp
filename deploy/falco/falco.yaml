# Falco Configuration for KARM OS
# https://falco.org/docs/reference/configuration/

json_output: true
json_include_output_property: true
json_include_tags_property: true

log_level: info

# Output configuration
stdout_output:
  enabled: true

file_output:
  enabled: true
  keep_alive: true
  filename: /var/log/falco/falco.log

syslog_output:
  enabled: false

http_output:
  enabled: true
  url: "http://localhost:2802/"
  headers:
    Content-Type: application/json

# Program output (for falcosidekick)
program_output:
  enabled: true
  program: "jq -c . | curl -X POST -H 'Content-Type: application/json' -d @- http://localhost:2802/"
  keep_alive: true

# File monitoring
watch_config_files: true

# Rules
rules_files:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/falco_rules.local.yaml
  - /etc/falco/karm-rules.yaml

# Exception files (for known false positives)
exceptions_file: /etc/falco/falco_exceptions.yaml

# Plugin configuration
plugins:
  - name: jevt
    library_path: libjevt_plugin.so
    enabled: true
  - name: k8saudit
    library_path: libk8saudit_plugin.so
    enabled: false

# Web server for health checks
webserver:
  enabled: true
  listen_port: 8765
  k8s_audit_endpoint: /k8s_audit
  health_check_endpoint: /health