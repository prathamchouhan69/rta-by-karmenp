<style>

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#f0f6fc}
header{background:linear-gradient(135deg,#1a2744,#0f1117);border-bottom:1px solid #30363d;padding:16px 24px;position:sticky;top:0;z-index:99;box-shadow:0 2px 12px rgba(0,0,0,.5)}

.sub{font-size:12px;color:#8b949e;margin-top:3px}
.pg{height:4px;background:#21262d;border-radius:2px;margin-top:10px;width:320px}
.pf{height:100%;background:linear-gradient(90deg,#f59e0b,#fcd34d);border-radius:2px;transition:width .4s ease}
.wrap{max-width:960px;margin:0 auto;padding:20px 14px 100px}
.sh{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;padding:8px 14px;border-radius:8px;margin:24px 0 10px;display:inline-flex;align-items:center;gap:8px}
.sh-icon{width:18px;height:18px;opacity:.9}
.rb{background:#161b22;border:1.5px solid #30363d;border-radius:12px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.rb.done{border-color:#3fb950}
.rb.done .rnum{background:#3fb950!important}
.rh{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;transition:background .15s}
.rh:hover{background:#1c2333}
.rnum{width:26px;height:26px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.rtitle{font-size:13px;font-weight:700;color:#f0f6fc}
.tick{margin-left:6px;font-size:11px;color:#3fb950;display:none}
.rb.done .tick{display:inline}
.rch{margin-left:auto;color:#484f58;font-size:14px;transition:transform .25s}
.rb.op .rch{transform:rotate(180deg)}
.bd{display:none;padding:0 14px 14px;gap:8px;flex-wrap:wrap}
.rb.op .bd{display:flex}
.opt{width:calc(50% - 4px);border:2px solid #30363d;border-radius:10px;cursor:pointer;transition:all .18s;background:#0f1117;overflow:hidden;position:relative}
.opt:hover{border-color:#f59e0b;transform:translateY(-2px);box-shadow:0 4px 16px rgba(245,158,11,.15)}
.opt.sel{border-color:#f59e0b;background:#1a1400;box-shadow:0 0 0 3px rgba(245,158,11,.2)}
.opt-preview{width:100%;height:110px;background:#0a0e14;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;border-bottom:1px solid #21262d}
.opt-body{padding:10px 12px}
.opt-label{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.ol{font-size:9px;font-weight:800;color:#f59e0b;background:rgba(245,158,11,.15);border-radius:3px;padding:2px 6px}
.opt.sel .ol{background:#f59e0b;color:#000}
.ot{font-size:12px;font-weight:700;color:#f0f6fc}
.od{font-size:10px;color:#8b949e;line-height:1.45;margin-top:3px}
.ow{font-size:9px;color:#f59e0b;margin-top:4px;font-weight:600}
.ora{position:absolute;top:8px;right:8px;width:16px;height:16px;border-radius:50%;border:2px solid #484f58;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s}
.opt.sel .ora{border-color:#f59e0b;background:#f59e0b}
.opt.sel .ora::after{content:'';width:5px;height:5px;border-radius:50%;background:#000;display:block}
.tags{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.tg{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px}
.dec{background:#1a2e1a;color:#3fb950}.str{background:#1a2135;color:#58a6ff}
.mot{background:#2d1a4a;color:#bc8cff}.val{background:#2e1f0a;color:#f0883e}
.dat{background:#0a2435;color:#39c5cf}.ux{background:#0a2e1a;color:#56d364}
.sec{background:#2e2200;color:#e3b341}
.na{margin-top:10px;width:100%}
.na label{font-size:10px;font-weight:700;color:#484f58;display:block;margin-bottom:4px}
.na textarea{width:100%;border:1px solid #30363d;border-radius:6px;padding:7px 9px;font-size:11px;resize:vertical;min-height:36px;font-family:inherit;background:#161b22;color:#f0f6fc}
.foot{position:fixed;bottom:0;left:0;right:0;background:#161b22;border-top:1px solid #30363d;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;z-index:99;box-shadow:0 -4px 16px rgba(0,0,0,.4)}
.fc{font-size:13px;color:#8b949e;font-weight:600}.fc b{color:#f59e0b}
.cbtn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;border:none;padding:10px 22px;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;transition:opacity .15s}
.cbtn:hover{opacity:.85}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.obox{background:#161b22;border:1px solid #30363d;border-radius:14px;width:100%;max-width:640px;box-shadow:0 25px 60px rgba(0,0,0,.6)}
.ohdr{padding:16px 20px;border-bottom:1px solid #30363d;display:flex;align-items:center;justify-content:space-between}
.ohdr h2{font-size:15px;font-weight:700;color:#f0f6fc}
.xbtn{background:transparent;border:1px solid #30363d;border-radius:6px;font-size:16px;cursor:pointer;color:#8b949e;width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.obody{padding:18px;max-height:55vh;overflow-y:auto}
.obody pre{font-size:11px;line-height:1.8;white-space:pre-wrap;background:#0f1117;border-radius:8px;padding:14px;color:#f0f6fc}
.oftr{padding:12px 20px;border-top:1px solid #30363d;display:flex;justify-content:flex-end;gap:8px}
.gbtn{background:#238636;color:#fff;border:none;padding:9px 18px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}

// ─── ENGINE ───────────────────────────────────────────────────────────────────
function build(){
  const app=document.getElementById('app');let tot=0;
  D.forEach(sec=>{
    const sd=document.createElement('div');
    const sh=document.createElement('div');sh.className='sh';sh.style.background=sec.c;
    sh.innerHTML=sec.s+' <span style="opacity:.5;font-weight:400">('+sec.r.length+' refs)</span>';
    sd.appendChild(sh);
    sec.r.forEach(ref=>{
      tot++;
      const rb=document.createElement('div');rb.className='rb';rb.id='r'+ref.i;
      const rh=document.createElement('div');rh.className='rh';rh.onclick=()=>tog(ref.i);
      rh.innerHTML='<div class="rnum" style="background:'+sec.c+'">'+ref.i+'</div><div style="flex:1"><div class="rtitle">'+ref.n+'</div></div><span class="tick">Done</span><div class="rch">v</div>';
      rb.appendChild(rh);
      const bd=document.createElement('div');bd.className='bd';
      ref.o.forEach(opt=>{
        const od=document.createElement('div');od.className='opt';od.id='o'+ref.i+opt.l;od.onclick=()=>pick(ref.i,opt.l);
        const tags=opt.tg.map(t=>'<span class="tg '+t+'">'+TL[t]+'</span>').join('');
        const pk=ref.i+'_'+opt.l;
        const pv=PREV[pk]||'<svg width="200" height="110" viewBox="0 0 200 110"><rect width="200" height="110" fill="#0a0e14"/><text x="100" y="58" text-anchor="middle" fill="#30363d" font-size="9">'+opt.t+'</text></svg>';
        od.innerHTML='<div class="opt-preview">'+pv+'</div><div class="opt-body"><div class="opt-label"><span class="ol">'+opt.l+'</span><span class="ot">'+opt.t+'</span></div><div class="od">'+opt.d+'</div><div class="ow">Where: '+opt.w+'</div><div class="tags">'+tags+'</div></div><div class="ora"></div>';
        bd.appendChild(od);
      });
      const na=document.createElement('div');na.className='na';
      na.innerHTML='<label>Note #'+ref.i+':</label><textarea placeholder="Your instruction..." oninput="saveN('+ref.i+',this.value)"></textarea>';
      bd.appendChild(na);rb.appendChild(bd);sd.appendChild(rb);
    });
    app.appendChild(sd);
  });
  document.getElementById('tc').textContent=tot;updateUI();
}
function tog(i){document.getElementById('r'+i).classList.toggle('op');}
function pick(ri,ol){
  sel[ri]=ol;
  const ref=D.flatMap(s=>s.r).find(r=>r.i===ri);
  ref.o.forEach(o=>{const e=document.getElementById('o'+ri+o.l);if(e)e.classList.remove('sel');});
  const e=document.getElementById('o'+ri+ol);if(e)e.classList.add('sel');
  document.getElementById('r'+ri).classList.add('done');
  updateUI();
  setTimeout(()=>{
    document.getElementById('r'+ri).classList.remove('op');
    const all=D.flatMap(s=>s.r);const idx=all.findIndex(r=>r.i===ri);
    if(idx<all.length-1){const nb=document.getElementById('r'+all[idx+1].i);if(nb){nb.classList.add('op');nb.scrollIntoView({behavior:'smooth',block:'start'});}}
  },280);
}
function saveN(i,v){notes[i]=v;}
function updateUI(){
  const c=Object.keys(sel).length,tot=D.reduce((a,s)=>a+s.r.length,0);
  document.getElementById('sc').textContent=c;
  document.getElementById('pc').textContent=Math.round(c/tot*100)+'%';
  document.getElementById('pf').style.width=(c/tot*100)+'%';
}
function showOut(){
  let out='KARM DESIGN SELECTIONS\n'+'='.repeat(50)+'\n\n';
  D.forEach(sec=>{
    out+='## '+sec.s+'\n\n';
    sec.r.forEach(ref=>{
      const s=sel[ref.i],op=ref.o.find(o=>o.l===s);
      out+=ref.i+'. '+ref.n+'\n';
      if(s&&op){out+='   SELECTED '+s+': '+op.t+'\n   '+op.d+'\n   Where: '+op.w+'\n';}
      else{out+='   NOT SELECTED\n';}
      if(notes[ref.i]&&notes[ref.i].trim())out+='   Note: '+notes[ref.i]+'\n';
      out+='\n';
    });
  });
  const un=D.flatMap(s=>s.r).filter(r=>!sel[r.i]);
  if(un.length)out+='\nUNSELECTED ('+un.length+'):\n'+un.map(r=>'  - #'+r.i+' '+r.n).join('\n');
  document.getElementById('ot').textContent=out;document.getElementById('om').classList.add('show');
}
function closeOut(){document.getElementById('om').classList.remove('show');}
function cpText(){
  navigator.clipboard.writeText(document.getElementById('ot').textContent).then(()=>{
    const b=event.target;b.textContent='Copied!';b.style.background='#238636';
    setTimeout(()=>{b.textContent='Copy to Clipboard';b.style.background='';},2500);
  });
}
build();
document.getElementById('r1').classList.add('op');
</script>
