# RTA by KARM - Prometheus Monitoring Configuration
# Place at /etc/prometheus/prometheus.yml

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: 'rta-karm'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (host metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'rta-karm-host'

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'rta-karm-containers'

  # RTA Flux Backend
  - job_name: 'rta-flux'
    metrics_path: /metrics
    static_configs:
      - targets: ['flux:8788']
        labels:
          service: 'flux'
          component: 'ai-backend'
    metrics_path: /metrics
    scrape_interval: 15s

  # RTA Gateway
  - job_name: 'rta-gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:8787']
        labels:
          service: 'gateway'
          component: 'api-gateway'
    metrics_path: /metrics
    scrape_interval: 15s

  # Nginx (web)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'
          component: 'web-proxy'

  # PM2 Process Manager
  - job_name: 'pm2'
    static_configs:
      - targets: ['pm2-exporter:9209']
        labels:
          service: 'pm2'
          component: 'process-manager'

  # Blackbox Exporter (endpoint probing)
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://rta-karm.com
          - https://rta-karm.com/health
          - https://api.rta-karm.com/health
          - https://rta-karm.com:8787/readyz
          - https://rta-karm.com:8788/health
        labels:
          service: 'endpoints'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

