name: RTA by KARM - CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================================================================
  # CODE QUALITY & SECURITY
  # ========================================================================
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --workspaces=false
        working-directory: ./apps/web

      - name: Run ESLint
        run: npm run lint
        working-directory: ./apps/web

      - name: Run TypeScript typecheck
        run: npm run typecheck
        working-directory: ./apps/web

  flux-security-scan:
    name: Flux Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/flux/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=dev
        working-directory: ./apps/flux

      - name: Run security scan
        run: node scripts/scan.js
        working-directory: ./apps/flux

  # ========================================================================
  # TESTING
  # ========================================================================
  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web

      - name: Run tests
        run: npm test
        working-directory: ./apps/web

      - name: Run E2E smoke tests
        run: npm run test:e2e
        working-directory: ./apps/web

  test-flux:
    name: Flux Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/flux/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=dev
        working-directory: ./apps/flux

      - name: Run tests
        run: npm test
        working-directory: ./apps/flux

  test-gateway:
    name: Gateway Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/gateway/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/gateway

      - name: Run tests
        run: npm test
        working-directory: ./apps/gateway

  # ========================================================================
  # BUILD
  # ========================================================================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web

      - name: Build production
        run: npm run build
        working-directory: ./apps/web
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7

  build-flux:
    name: Build Flux
    runs-on: ubuntu-latest
    needs: [flux-security-scan, test-flux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/flux/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=dev
        working-directory: ./apps/flux

      - name: Verify build
        run: node --check src/server.js
        working-directory: ./apps/flux

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: flux-source
          path: apps/flux/
          retention-days: 7

  build-gateway:
    name: Build Gateway
    runs-on: ubuntu-latest
    needs: [test-gateway]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/gateway/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/gateway

      - name: Verify build
        run: npm run build
        working-directory: ./apps/gateway

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: gateway-source
          path: apps/gateway/
          retention-days: 7

  # ========================================================================
  # DOCKER BUILD & PUSH
  # ========================================================================
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [build-web, build-flux, build-gateway]
    if: github.event_name == 'push' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Flux
        id: meta-flux
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-flux
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Flux
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.flux
          push: true
          tags: ${{ steps.meta-flux.outputs.tags }}
          labels: ${{ steps.meta-flux.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Gateway
        id: meta-gateway
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-gateway
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.gateway
          push: true
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================================
  # DEPLOY
  # ========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # SSH to staging server and run deploy script
          # ssh user@staging.rta-karm.com "cd /opt/rta-karm && ./deploy.sh docker start"
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # ssh user@rta-karm.com "cd /opt/rta-karm && ./deploy.sh docker start"
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}

  # ========================================================================
  # NOTIFICATIONS
  # ========================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "Pipeline failed! Sending notification..."
          # curl -X POST ${{ secrets.SLACK_WEBHOOK }} -d '{"text": "RTA by KARM pipeline failed"}'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # ========================================================================
  # SUMMARY
  # ========================================================================
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, flux-security-scan, test-web, test-flux, test-gateway, build-web, build-flux, build-gateway, docker-build, deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Pipeline completed
        run: |
          echo "RTA by KARM CI/CD Pipeline completed"
          echo "Status: ${{ job.status }}"